<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="fhj-data" content="content/settings.json content/rescues-index.json">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furry Hearts of Jordan — Travel papers</title>
<meta name="description" content="Furry Hearts of Jordan rescues, treats and rehomes street cats and dogs in Jordan, with safe international adoption.">
<meta property="og:title" content="Furry Hearts of Jordan — Travel papers">
<meta property="og:description" content="Furry Hearts of Jordan rescues, treats and rehomes street cats and dogs in Jordan, with safe international adoption.">
<meta property="og:image" content="https://furryheartsofjordan.com/img/hero.jpg">
<link rel="icon" href="img/icon-180.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;family=Figtree:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
h1,h2{color:var(--cocoa, #A38273)}
strong,b,th,dt,h3{font-weight:500}
a{color:var(--ink, #2B1E1A)}a:hover{color:var(--accent-text, #704F44)}
.stamp{position:relative}
.stamp::before{content:"";position:absolute;inset:-11px;pointer-events:none;z-index:0;
background:
radial-gradient(circle,#fff 8px,transparent 8.6px) left top/22px 22px space no-repeat,
radial-gradient(circle,#fff 8px,transparent 8.6px) left bottom/22px 22px space no-repeat,
radial-gradient(circle,#fff 8px,transparent 8.6px) left top/22px 22px no-repeat space,
radial-gradient(circle,#fff 8px,transparent 8.6px) right top/22px 22px no-repeat space}
.stamp>*{position:relative;z-index:1}
</style>
<style>html{scroll-behavior:smooth}img{max-width:100%}@media (max-width:720px){h1{font-size:52px!important;width:auto!important;height:auto!important}h2{font-size:38px!important}section,footer{width:auto!important}p{width:auto!important;height:auto!important}}</style>
</head>
<body>
<template id="dc-root">

<div style="font-family: var(--font-sans, 'GT Walsheim', 'Figtree', system-ui, sans-serif); color: var(--ink, #2B1E1A); background: var(--paper, #FFFFFF); min-height: 100vh; font-weight: 300">

<header style="max-width: 1240px; margin: 0 auto; padding: 20px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; padding-top: 50px">
<a href="index.html" aria-label="Furry Hearts of Jordan home" style="display: flex; align-items: center; text-decoration: none">
<img class="logo-wide" src="img/logo-wide.png" alt="Furry Hearts of Jordan — Feeding. Healing. Rehoming" style="width: 260px; max-width: 62vw; height: auto; display: block">
</a>
<a href="{{fileHref}}" style="font-weight: 500; font-size: 16px">← Back to {{name}}'s file</a>
</header>

<section style="max-width: 1240px; margin: 0 auto; padding: 32px 32px 56px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 32px">
<div style="flex: 1 1 560px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<span style="background: var(--sunshine, #FEC200); padding: 7px 14px; border-radius: 999px; font-weight: 500; font-size: 14px">Travel papers in progress</span>
<template data-sc-if="{{caseNo}}"><span style="background: var(--sky-light, #A9E5FF); padding: 7px 14px; border-radius: 999px; font-weight: 500; font-size: 14px">Case #{{caseNo}}</span></template>
</div>
<h1 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 72px; line-height: 0.98; text-transform: uppercase">{{name}}'s travel papers</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.6; max-width: 640px">Every official document for {{name}}'s journey to {{country}}, in one place. For the adopter, the airline and the border vet.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="{{allPdf}}" style="text-decoration: none; background: var(--ink, #2B1E1A); color: var(--paper, #FFFFFF); padding: 16px 26px; border-radius: 999px; font-weight: 500; font-size: 16px">Download all papers (PDF)</a>
</div>
</section>

<section aria-label="Travel progress" style="background: var(--cream, #FCF2F0); padding: 40px 32px">
<ol style="max-width: 1240px; margin: 0 auto; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px">
<template data-sc-for="{{progress}}" data-as="p">
<li style="background: var(--paper, #FFFFFF); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<span style="width: 40px; height: 40px; border-radius: 999px; background: {{p.dot}}; display: flex; align-items: center; justify-content: center; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-size: 20px; color: var(--paper, #FFFFFF)">{{p.n}}</span>
<strong style="font-size: 16px; line-height: 1.3">{{p.label}}</strong>
<span style="font-size: 14px">{{p.state}}</span>
</li>
</template>
</ol>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 72px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 48px">
<template data-sc-for="{{docs}}" data-as="d">
<article style="background: {{d.color}}; padding: 20px">
<div class="stamp" style="background: var(--paper, #FFFFFF); padding: 28px; display: flex; flex-direction: column; gap: 18px; height: 100%; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 30px; line-height: 1.05; text-transform: uppercase">{{d.title}}</h2>
<span style="background: {{d.pill}}; padding: 6px 12px; border-radius: 999px; font-weight: 500; font-size: 13px; white-space: nowrap">{{d.status}}</span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.55">{{d.why}}</p>
<dl style="margin: 0; display: flex; flex-direction: column; gap: 0">
<template data-sc-for="{{d.rows}}" data-as="r">
<div style="display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--blush, #EADCD9); font-size: 15px">
<dt>{{r.k}}</dt>
<dd style="margin: 0; font-weight: 500; text-align: right">{{r.v}}</dd>
</div>
</template>
</dl>
<template data-sc-if="{{d.file}}"><a href="{{d.file}}" target="_blank" rel="noopener" style="font-weight: 500; font-size: 15px">View document ↗</a></template>
</div>
</article>
</template>
</section>

<section style="max-width: 1240px; margin: 0 auto 80px; padding: 0 32px">
<div style="background: var(--ink, #2B1E1A); color: var(--paper, #FFFFFF); border-radius: 28px; padding: 32px 36px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between">
<p style="margin: 0; font-size: 17px; line-height: 1.6; max-width: 820px"><strong>Good to know:</strong> entry rules, waiting periods after the titer test and certificate validity are different for each country. We check {{country}}'s official requirements for every adoption, and dates on this page are set from them.</p>
<a href="{{igMsg}}" data-msg="{{askMsg}}" target="_blank" rel="noopener" style="text-decoration: none; background: var(--peach, #FFB68D); color: var(--paper, #FFFFFF); padding: 14px 24px; border-radius: 999px; font-weight: 500; font-size: 16px">Ask us on Instagram</a>
</div>
</section>

<footer style="color: var(--paper, #FFFFFF); padding: 48px 32px; background-color: var(--cocoa, #a38273)">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; font-size: 15px">
<img src="img/logo-round.png" alt="Furry Hearts of Jordan logo" style="width: 96px; height: 96px">
<span>Personal details of adopters are hidden on all public documents.</span>
</div>
</footer>
</div>
</template>
<div id="dc-app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Please turn on JavaScript to see this page.</p></noscript>
<script type="text/x-dc">
class Component extends DCLogic {
renderVals() {
const F = window.FHJ, D = F.data, S = D.settings || {};
const all = ((D['rescues-index'] || {}).rescues || []);
const r = all.find((x) => x.slug === F.param('id')) || all[0] || { name: '' };
document.title = r.name + "'s travel papers — Furry Hearts of Jordan";
const ok = 'var(--mint)', pending = 'var(--sunshine)';
const colors = ['var(--sky)', 'var(--orchid)', 'var(--sunshine)', 'var(--green)', 'var(--coral)', 'var(--teal)'];
const st = { done: 'Done', progress: 'In progress', todo: 'Not yet' };
return {
  name: r.name, caseNo: r.case_number || '', country: r.fee_country || 'your country', fileHref: 'rescue.html#' + r.slug,
  igMsg: 'https://ig.me/m/' + (S.instagram_user || ''), askMsg: 'Hi Furry Hearts of Jordan! I have a question about ' + r.name + "'s travel papers (sent from furryheartsofjordan.com)", allPdf: r.papers_pdf || '#',
  progress: (r.travel || []).map((x, i) => ({ n: String(i + 1), label: x.label, state: (st[x.state] || '') + (x.date ? ' · ' + x.date : ''), dot: colors[i % 6] })),
  docs: (r.papers || []).map((d, i) => ({ title: d.title, status: d.status || '', pill: /valid|registered|pass|done/i.test(d.status || '') ? ok : pending, color: colors[i % 6], why: d.why || '', file: d.file || '',
    rows: F.lines(d.details).map((l) => { const k = l.split(':'); return { k: k[0], v: k.slice(1).join(':').trim() }; }) }))
};
}
}
</script>
<script src="js/dc-runtime.js"></script>
</body>
</html>
