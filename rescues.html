<template id="dc-root">

<section style="max-width: 1240px; margin: 0 auto; padding: 40px 32px 32px; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 76px; line-height: 0.98; text-transform: uppercase; color: var(--peach, #FFB68D)">Our rescue family</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.6; max-width: 680px; color: var(--accent-text, #704F44)">Every cat we have rescued, treated and loved: the ones waiting for a home, the ones who live with us, the ones who flew to new families, and the ones we lost. Tap a card to meet them.</p>
<label style="display: flex; align-items: center; gap: 10px; max-width: 640px; margin-top: 10px; padding: 6px 6px 6px 22px; border-radius: 999px; border: 3px solid var(--peach, #ffb68d); background: #fff">
<input id="fhj-search" type="search" value="{{q}}" onInput="{{onSearch}}" placeholder="{{ph}}" aria-label="Search our rescues" autocomplete="off" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 17px; padding: 12px 0; color: var(--accent-text, #704f44); background: transparent">
<template data-sc-if="{{q}}"><button type="button" onClick="{{clear}}" aria-label="Clear search" style="font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--cream, #fcf2f0); color: var(--peach, #ffb68d); font-weight: 500">Clear</button></template>
<span aria-hidden="true" style="flex: 0 0 auto; width: 46px; height: 46px; border-radius: 999px; background: var(--peach, #ffb68d); display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#fff" stroke-width="2.8"></circle><path d="M15.5 15.5 L20.5 20.5" stroke="#fff" stroke-width="2.8" stroke-linecap="round"></path></svg></span>
</label>
<template data-sc-if="{{searching}}"><p style="margin: 4px 0 0; font-size: 15px; font-weight: 500; color: var(--cocoa, #a38273)">{{resultLabel}}</p></template>
</section>

<template data-sc-if="{{notSearching}}"><section aria-label="Filters" style="max-width: 1240px; margin: 0 auto; padding: 8px 32px 40px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between">
<div role="group" aria-label="Species" style="display: flex; flex-wrap: wrap; gap: 10px">
<template data-sc-for="{{speciesBtns}}" data-as="b">
<button type="button" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}" style="font: inherit; cursor: pointer; font-weight: 500; font-size: 16px; padding: 12px 22px; border-radius: 999px; border: 3px solid {{b.color}}; background: {{b.bg}}; color: {{b.fg}}">{{b.label}}</button>
</template>
</div>
<div role="group" aria-label="Status" style="display: flex; flex-wrap: wrap; gap: 10px">
<template data-sc-for="{{statusBtns}}" data-as="b">
<button type="button" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}" style="font: inherit; cursor: pointer; font-weight: 500; font-size: 15px; padding: 10px 18px; border-radius: 999px; border: 3px solid {{b.color}}; background: {{b.bg}}; color: {{b.fg}}">{{b.label}}</button>
</template>
</div>
<template data-sc-if="{{showCountOnly}}"><span style="width: 100%; font-size: 15px; color: var(--cocoa)">{{countLabel}}</span></template>
<template data-sc-if="{{showAvail}}"><div role="group" aria-label="Available" style="display: flex; flex-wrap: wrap; gap: 10px; width: 100%">
<template data-sc-for="{{availBtns}}" data-as="b">
<button type="button" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}" style="font: inherit; cursor: pointer; font-weight: 500; font-size: 15px; padding: 10px 18px; border-radius: 999px; border: 3px solid {{b.color}}; background: {{b.bg}}; color: {{b.fg}}">{{b.label}}</button>
</template>
<span style="align-self: center; margin-left: auto; font-size: 15px; color: var(--cocoa)">{{countLabel}}</span>
</div></template>
<template data-sc-if="{{showTags}}"><div role="group" aria-label="Group" style="display: flex; flex-wrap: wrap; gap: 10px; width: 100%">
<template data-sc-for="{{tagBtns}}" data-as="b">
<button type="button" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}" style="font: inherit; cursor: pointer; font-weight: 500; font-size: 15px; padding: 10px 18px; border-radius: 999px; border: 3px solid {{b.color}}; background: {{b.bg}}; color: {{b.fg}}">{{b.label}}</button>
</template>
<span style="align-self: center; margin-left: auto; font-size: 15px; color: var(--cocoa)">{{countLabel}}</span>
</div></template>
</section></template>

<section style="max-width: 1240px; margin: 0 auto; padding: 0 32px 96px">
<div style="display: flex; flex-direction: column; gap: 40px">
<template data-sc-for="{{groups}}" data-as="g">
<div style="display: flex; flex-direction: column; gap: 14px">
<template data-sc-if="{{g.label}}"><span style="font-weight: 500; font-size: 16px; color: {{g.color}}">{{g.label}}</span></template>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax({{g.min}}, 1fr)); gap: 36px">
<template data-sc-for="{{g.cards}}" data-as="c">
<a href="{{c.href}}" style="text-decoration: none; background: {{c.color}}; padding: 18px; display: block">
<div class="stamp" style="background: var(--paper, #FFFFFF); padding: 14px; display: flex; flex-direction: column; gap: 14px">
<div style="position: relative">
<template data-sc-if="{{c.hasPhoto}}">
<img src="{{c.photo}}" alt="{{c.name}}" style="display: block; width: 100%; height: 220px; object-fit: cover; object-position: {{c.pos}}">
</template>
<template data-sc-if="{{c.noPhoto}}">
<div style="height: 220px; background: {{c.tint}}; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px; color: var(--paper, #FFFFFF)"><img src="img/{{c.icon}}" alt="" style="width: 84px; height: 84px; opacity: 0.9"></div>
</template>
<span aria-label="{{c.kind}}" role="img" style="position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 999px; background: {{c.color}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px var(--paper, #FFFFFF)">
<template data-sc-if="{{c.isCat}}"><img src="img/cat-icon.png" alt="" aria-hidden="true" style="display: block; width: 28px; height: 28px; object-fit: contain"></template>
<template data-sc-if="{{c.isDog}}"><img src="img/dog-icon.png" alt="" aria-hidden="true" style="display: block; width: 28px; height: 28px; object-fit: contain"></template>
</span>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px">
<span style="font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-size: 26px; text-transform: uppercase; color: {{c.textColor}}; min-width: 0; overflow-wrap: anywhere">{{c.name}}</span>
<span style="font-size: 13px; font-weight: 500; color: var(--paper, #FFFFFF); padding: 5px 10px; border-radius: 999px; white-space: nowrap; background: {{c.statusColor}}">{{c.status}}</span>
</div>
<template data-sc-if="{{c.dest}}"><span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--cream, #fcf2f0); color: var(--accent-text, #704f44); font-size: 14px; font-weight: 500; white-space: nowrap"><template data-sc-if="{{c.destFlag}}"><img src="{{c.destFlag}}" alt="" style="width: 22px; height: 15px; border-radius: 3px; object-fit: cover; display: block"></template>✈ {{c.dest}}</span></template>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--accent-text, #704F44)">{{c.meta}}</p>
</div>
</a>
</template>
</div>
</div>
</template>
</div>
<template data-sc-if="{{empty}}">
<p style="margin: 40px 0 0; font-size: 18px; text-align: center; color: var(--cocoa, #A38273)">{{emptyMsg}}</p>
</template>
</section>

<section style="max-width: 1240px; margin: 0 auto 96px; padding: 0 32px">
<div style="background: var(--peach, #FFB68D); padding: 22px">
<div class="stamp" style="background: var(--paper, #FFFFFF); padding: 48px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: space-between">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 44px; line-height: 1.02; text-transform: uppercase; color: var(--peach, #ffb68d)">Can't adopt? You can still help</h2>
<p style="margin: 0; font-size: 19px; line-height: 1.6; color: var(--accent-text, #704F44)"><span style="display: block; text-wrap: balance">Donate, sponsor a cat, or share their stories and follow us on Instagram.</span><span style="display: block; text-wrap: balance">One share might be the one that reaches their family and brings them home.</span></p>
</div>
<a href="index.html#cliq" style="text-decoration: none; color: var(--paper, #FFFFFF); padding: 17px 30px; border-radius: 999px; font-weight: 500; font-size: 17px; background-color: var(--peach, #ffb68d)">Ways to donate</a>
</div>
</div>
</section>

<footer class="fhj-footer"><div class="fhj-foot-in"><img class="fhj-foot-logo" src="img/logo-round.png" alt="Furry Hearts of Jordan logo"><p class="fhj-slogan">Safe Homes.<br>Lifelong Care.</p><div class="fhj-foot-info"><span style="display:inline-flex;align-items:center;gap:9px"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 21.5s-6.5-6.2-6.5-11.3a6.5 6.5 0 0 1 13 0c0 5.1-6.5 11.3-6.5 11.3z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="10.2" r="2.4" fill="#fff"/></svg>Amman, Jordan</span><a href="https://www.instagram.com/furryheartsofjordan/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="17.3" cy="6.7" r="1.3" fill="#fff"/></svg>@furryheartsofjordan</a><a href="https://www.instagram.com/theteefamilyhouse/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="17.3" cy="6.7" r="1.3" fill="#fff"/></svg>@theteefamilyhouse</a><a href="https://www.youtube.com/@FurryHeartsofJo" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="1.5" y="5" width="21" height="14" rx="4.5" fill="#fff"/><path d="M10 9 L15.5 12 L10 15 Z" fill="#ffb68d"/></svg>@FurryHeartsofJo</a></div></div></footer>
</div>
</template>
<div id="dc-app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Please turn on JavaScript to see this page.</p></noscript>
<script type="text/x-dc">
