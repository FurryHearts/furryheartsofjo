<style>
body{margin:0}
h1,h2{color:var(--cocoa, #A38273)}

background:

<style>html{scroll-behavior:smooth}img{max-width:100%}@media (max-width:720px){h1{font-size:52px!important;width:auto!important;height:auto!important}h2{font-size:38px!important}section,footer{width:auto!important}p{width:auto!important;height:auto!important}}.fhj-steps>*{min-width:0}@media (max-width:1100px){.fhj-steps{grid-template-columns:repeat(3,minmax(0,1fr))!important}}@media (max-width:720px){.fhj-steps{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}.fhj-steps>*{padding:13%!important;gap:2px!important}.fhj-steps h3{font-size:15px!important}.fhj-steps p{font-size:12px!important;line-height:1.3!important}.fhj-steps img{width:40px!important;height:40px!important}}.fhj-header{max-width:1240px;margin:0 auto;padding:50px 32px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:20}.fhj-logo img{width:260px;max-width:62vw;height:auto;display:block}.fhj-nav{display:flex;align-items:center;gap:26px;font-weight:500;font-size:16px}.fhj-nav a,.fhj-menu nav a{text-decoration:none;color:var(--cocoa,#A38273)}.fhj-nav a[aria-current]{text-decoration:underline;text-underline-offset:6px}.fhj-header .fhj-donate{background:var(--peach,#FFB68D);color:var(--paper,#fff)!important;padding:12px 24px;border-radius:999px}.fhj-menu{display:none;position:relative}.fhj-menu summary{list-style:none;cursor:pointer;width:48px;height:48px;border-radius:14px;border:3px solid var(--peach,#FFB68D);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.fhj-menu summary::-webkit-details-marker{display:none}.fhj-menu summary span{display:block;width:22px;height:3px;border-radius:3px;background:var(--cocoa,#A38273)}.fhj-menu nav{position:absolute;right:0;top:58px;background:var(--paper,#fff);border:3px solid var(--peach,#FFB68D);border-radius:24px;padding:12px;display:flex;flex-direction:column;min-width:220px;box-shadow:0 12px 30px rgba(112,79,68,.15)}.fhj-menu nav a{padding:12px 14px;font-weight:500;font-size:17px;border-radius:14px}.fhj-menu nav .fhj-donate{text-align:center;margin-top:6px}.fhj-dd{position:relative}.fhj-dd-btn span{font-size:12px}.fhj-dd-menu{display:none;position:absolute;left:-14px;top:100%;padding-top:12px;min-width:190px}.fhj-dd-menu::before{content:"";position:absolute;inset:12px 0 0;background:var(--paper,#fff);border:3px solid var(--peach,#FFB68D);border-radius:20px;box-shadow:0 12px 30px rgba(112,79,68,.15)}.fhj-dd-menu a{position:relative;display:block;padding:12px 18px}.fhj-dd-menu a:first-child{margin-top:8px}.fhj-dd-menu a:last-child{margin-bottom:8px}.fhj-dd:hover .fhj-dd-menu,.fhj-dd:focus-within .fhj-dd-menu{display:block}.fhj-sub-title{padding:12px 14px 2px;font-weight:500;font-size:17px;color:var(--cocoa,#A38273)}.fhj-sub{display:flex;flex-direction:column;padding-left:14px}.fhj-sub a{font-size:15px!important;font-weight:400!important}@media (max-width:980px){.fhj-tails{grid-template-columns:repeat(2,minmax(0,1fr))!important}}@media (max-width:560px){.fhj-tails{grid-template-columns:1fr!important}}@media (max-width:980px){.fhj-nav{display:none}.fhj-menu{display:block}.fhj-header{padding:24px 20px 12px}}.fhj-gingham{background-color:#FFFCF2;background-image:url(img/sparkles.svg),linear-gradient(90deg,rgba(134,182,232,.38) 50%,transparent 50%),linear-gradient(rgba(134,182,232,.38) 50%,transparent 50%);background-size:300px 300px,26px 26px,26px 26px}.fhj-tiles>*{min-width:0}.fhj-tiles>*>:not(svg),.fhj-steps>*>:not(svg){position:relative;z-index:1}@media (max-width:980px){.fhj-tiles{grid-template-columns:repeat(3,minmax(0,1fr))!important}}@media (max-width:720px){.fhj-tiles{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}.fhj-tiles>*{padding:13%!important;gap:2px!important}.fhj-tiles h3{font-size:14px!important}.fhj-tiles p{font-size:11px!important;line-height:1.22!important}.fhj-tiles img{width:34px!important;height:34px!important}.fhj-tiles>* span{font-size:10px!important;margin-top:1px!important;padding:2px 7px!important}}</style>

<body>
<template id="dc-root">

<div style="font-family: var(--font-sans, 'GT Walsheim', 'Figtree', system-ui, sans-serif); color: var(--ink, #704F44); background: var(--paper, #FFFFFF); min-height: 100vh; font-weight: 300">

<header class="fhj-header"><a href="index.html" aria-label="Furry Hearts of Jordan home" class="fhj-logo"><img src="img/logo-wide.png" alt="Furry Hearts of Jordan — Feeding. Healing. Rehoming"></a><nav class="fhj-nav" aria-label="Main"><a href="about.html">About Us</a><div class="fhj-dd"><a href="rescues.html" class="fhj-dd-btn">Adopt <span aria-hidden="true">▾</span></a><div class="fhj-dd-menu"><a href="rescues.html">Our Rescues</a><a href="index.html#adopt">How to adopt</a></div></div><a href="index.html#tails">Happy Tails</a><a href="cat-world.html">Cat World</a><a href="shop.html">Ted's Shop</a><a class="fhj-donate" href="index.html#support">Donate</a></nav><details class="fhj-menu"><summary aria-label="Menu"><span></span><span></span><span></span></summary><nav aria-label="Menu"><a href="about.html">About Us</a><span class="fhj-sub-title">Adopt</span><div class="fhj-sub"><a href="rescues.html">Our Rescues</a><a href="index.html#adopt">How to adopt</a></div><a href="index.html#tails">Happy Tails</a><a href="cat-world.html">Cat World</a><a href="shop.html">Ted's Shop</a><a class="fhj-donate" href="index.html#support">Donate</a></nav></details></header>

<section style="background: var(--lavender, #B8B8FF); padding: 40px 32px; margin-top: 24px">
<div class="stamp" style="max-width: 1180px; margin: 0 auto; background: var(--paper, #FFFFFF); padding: 56px 48px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 20px">
<span style="align-self: flex-start; color: var(--paper, #FFFFFF); padding: 8px 16px; border-radius: 999px; font-weight: 500; font-size: 14px; background-color: var(--lavender, #b8b8ff)">Pet Taxi · Abu Zayed</span>
<h1 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 68px; line-height: 0.98; text-transform: uppercase">Cover a ride</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.6; max-width: 560px; color: var(--accent-text, #704F44)">Every day our rescues ride with Abu Zayed: to the clinic, to check-ups and home again. Pick a ride below, pay it by CliQ, and send us the screenshot on Instagram. We'll mark it paid so the next person can cover the next ride.</p>
</div>
<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 14px">
<div style="border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; background-color: var(--lavender, #b8b8ff)">
<span style="font-size: 14px; font-weight: 500; color: var(--paper, #FFFFFF); text-transform: uppercase; letter-spacing: 0.5px">Abu Zayed Transportation</span>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 28px; font-weight: 500; color: var(--paper, #FFFFFF)">CliQ: {{cliqShown}}</span>
<button type="button" onClick="{{copy}}" aria-label="Copy CliQ number" style="font: inherit; cursor: pointer; font-size: 14px; font-weight: 500; background: var(--paper, #FFFFFF); color: var(--lavender, #b8b8ff); border: 0; border-radius: 999px; padding: 10px 14px; white-space: nowrap">{{copyLabel}}</button>
</div>
<span style="font-size: 14px; color: var(--paper, #FFFFFF)">{{cliqName}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px; background-color: #F6F0FC">
<span style="font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-size: 36px; color: var(--coral, #FF696A)">{{waitingCount}}</span>
<span style="font-size: 14px; font-weight: 500">rides need covering</span>
</div>
<div style="border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px; background-color: #F6F0FC">
<span style="font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-size: 36px; color: var(--green, #4BC939)">{{paidCount}}</span>
<span style="font-size: 14px; font-weight: 500">rides paid. Thank you!</span>
</div>
</div>
</div>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 72px 32px 40px; display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 44px; text-transform: uppercase">How it works</h2>
<ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
<template data-sc-for="{{how}}" data-as="h">
<li style="display: flex; gap: 14px; align-items: flex-start">
<span style="flex: none; width: 48px; height: 48px; border-radius: 999px; background: {{h.color}}; display: flex; align-items: center; justify-content: center; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-size: 24px; color: var(--paper, #FFFFFF)">{{h.n}}</span>
<span style="font-size: 16px; line-height: 1.5; padding-top: 4px">{{h.text}}</span>
</li>
</template>
</ol>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 32px 32px 96px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 52px; text-transform: uppercase">Rides to cover</h2>
<div role="group" aria-label="Show rides" style="display: flex; flex-wrap: wrap; gap: 10px">
<template data-sc-for="{{filters}}" data-as="f">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="font: inherit; cursor: pointer; font-weight: 500; font-size: 15px; padding: 10px 18px; border-radius: 999px; border: 3px solid {{f.color}}; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
</template>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 22px">
<template data-sc-for="{{rides}}" data-as="r">
<article style="border-radius: 28px; border: 3px solid {{r.color}}; background: {{r.bg}}; padding: 24px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
<div style="flex: 0 0 140px; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-size: 30px; line-height: 1; color: {{r.color}}">{{r.day}}</span>
<span style="font-size: 14px; font-weight: 500">{{r.date}}</span>
<span style="font-size: 14px">{{r.trip}}</span>
</div>
<div style="flex: 1 1 320px; display: flex; flex-wrap: wrap; gap: 18px">
<template data-sc-for="{{r.pets}}" data-as="p">
<div style="display: flex; align-items: center; gap: 10px">
<template data-sc-if="{{p.photo}}"><img src="{{p.photo}}" alt="{{p.name}}" style="width: 64px; height: 64px; border-radius: 999px; object-fit: cover; border: 3px solid {{r.color}}; display: block"></template><template data-sc-if="{{p.noPhoto}}"><span style="width: 64px; height: 64px; border-radius: 999px; background: {{p.tint}}; border: 3px solid {{r.color}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--paper, #FFFFFF)"><img src="img/{{p.icon}}" alt="" style="width: 30px; height: 30px"></span></template>
<div style="display: flex; flex-direction: column; gap: 2px">
<strong style="font-size: 17px">{{p.name}}</strong>
<span style="font-size: 13px">{{p.kind}}</span>
</div>
</div>
</template>
</div>
<div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; min-width: 220px">
<span style="font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-size: 32px; color: {{r.color}}">{{r.cost}}</span>
<template data-sc-if="{{r.paid}}">
<span style="background: var(--green, #4BC939); color: var(--paper, #FFFFFF); padding: 12px 20px; border-radius: 999px; font-weight: 500; font-size: 15px">Paid ✓ {{r.thanks}}</span>
</template>
<template data-sc-if="{{r.open}}">
<a href="{{igMsg}}" data-msg="{{r.msg}}" target="_blank" rel="noopener" style="text-decoration: none; background: {{r.color}}; color: var(--paper, #FFFFFF); padding: 12px 20px; border-radius: 999px; font-weight: 500; font-size: 15px">{{r.cta}}</a>
</template>
</div>
</article>
</template>
</div>
<template data-sc-if="{{empty}}">
<p style="margin: 0; font-size: 18px; text-align: center; color: var(--cocoa, #A38273)">No rides here right now.</p>
</template>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: var(--accent-text, #704F44)">For the animals' safety, we never share pickup or drop-off locations.</p>
</section>

<footer style="color: var(--paper, #FFFFFF); padding: 48px 32px; background-color: var(--cocoa, #a38273)">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; font-size: 15px">
<img src="img/logo-round.png" alt="Furry Hearts of Jordan logo" style="width: 120px; height: 120px">
<span>Help with transport. Foster. Donate. Adopt. Share.</span>
</div>
</footer>
</div>
</template>
<div id="dc-app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Please turn on JavaScript to see this page.</p></noscript>
<script type="text/x-dc">
class Component extends DCLogic {
constructor(props) { super(props); this.state = { show: 'open', copied: false }; }
renderVals() {
const F = window.FHJ, D = F.data, S = D.settings || {}, R = D.rides || {};
const all = (R.rides || []).map((r) => ({ ...r, color: F.color(r.color, 'purple') }));
const show = this.state.show;
const list = all.filter((r) => show === 'all' || (show === 'open' ? !r.paid : r.paid));
let firstOpen = true;
const rides = list.map((r) => { const isNext = !r.paid && firstOpen; if (!r.paid) firstOpen = false;
  return { ...r, msg: 'Hi Furry Hearts of Jordan! I covered the ' + (r.day || '') + ' ride (' + (r.trip || '') + ', ' + (r.cost || '') + ') with Abu Zayed by CliQ through your website. Here is my screenshot 🐾', open: !r.paid, paid: !!r.paid, thanks: r.thanks || '', cta: isNext ? 'Cover this ride next' : 'Cover this ride', bg: r.paid ? 'var(--cream)' : 'var(--paper)',
    pets: (r.pets || []).map((p) => ({ name: p.name, kind: p.kind || 'Cat', photo: p.photo || '', noPhoto: !p.photo, icon: p.kind === 'Dog' ? 'dog-icon.png' : 'cat-icon.png', tint: F.color(r.color, 'purple') })) }; });
const f = (label, id, color) => ({ label, pressed: show === id ? 'true' : 'false', color, bg: show === id ? color : 'var(--paper)', fg: show === id ? 'var(--paper)' : color, pick: () => this.setState({ show: id }) });
return {
  cliqShown: R.cliq_alias || '', cliqName: R.cliq_name || '',
  copyLabel: this.state.copied ? 'Copied ✓' : 'Copy',
  copy: () => { try { navigator.clipboard.writeText(String(R.cliq_alias || '').replace(/\s/g, '')); } catch (e) {} this.setState({ copied: true }); },
  waitingCount: all.filter((r) => !r.paid).length, paidCount: all.filter((r) => r.paid).length,
  rides, empty: rides.length === 0, igMsg: 'https://ig.me/m/' + (S.instagram_user || ''),
  filters: [f('Needs covering', 'open', 'var(--coral)'), f('Paid', 'paid', 'var(--green)'), f('All rides', 'all', 'var(--cocoa)')],
  how: [
    { n: '1', text: 'Pick a ride that still needs covering.', color: 'var(--purple)' },
    { n: '2', text: 'Send the ride cost to Abu Zayed by CliQ.', color: 'var(--sky)' },
    { n: '3', text: 'Send us the screenshot on Instagram and mention the ride.', color: 'var(--orchid)' },
    { n: '4', text: 'We mark it Paid, and the next person covers the next ride.', color: 'var(--green)' }
  ]
};
}
}
</script>
<script src="js/dc-runtime.js"></script>
</body>
</html>
