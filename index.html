<body>
<template id="dc-root">

<div style="font-family: var(--font-sans, 'GT Walsheim', 'Figtree', system-ui, sans-serif); color: var(--ink, #2B1E1A); background: var(--paper, #FFFFFF); min-height: 100vh; font-weight: 300">

<header class="fhj-header"><a href="index.html" aria-label="Furry Hearts of Jordan home" class="fhj-logo"><img src="img/logo-wide.png" alt="Furry Hearts of Jordan — Feeding. Healing. Rehoming"></a><nav class="fhj-nav" aria-label="Main"><a href="about.html">About Us</a><div class="fhj-dd"><a href="rescues.html" class="fhj-dd-btn">Adopt <span aria-hidden="true">▾</span></a><div class="fhj-dd-menu"><a href="rescues.html">Our Rescues</a><a href="index.html#adopt">How to adopt</a></div></div><a href="index.html#tails">Happy Tails</a><a href="cat-world.html">Cat World</a><a href="shop.html">Ted's Shop</a><a class="fhj-donate" href="index.html#support">Donate</a></nav><details class="fhj-menu"><summary aria-label="Menu"><span></span><span></span><span></span></summary><nav aria-label="Menu"><a href="about.html">About Us</a><span class="fhj-sub-title">Adopt</span><div class="fhj-sub"><a href="rescues.html">Our Rescues</a><a href="index.html#adopt">How to adopt</a></div><a href="index.html#tails">Happy Tails</a><a href="cat-world.html">Cat World</a><a href="shop.html">Ted's Shop</a><a class="fhj-donate" href="index.html#support">Donate</a></nav></details></header>

<section style="max-width: 1240px; margin: 0 auto; padding: 32px 32px 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 24px">
<p style="margin: 0; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; font-size: 14px; color: var(--tangerine, #ff8049)">Rescue · Heal · Rehome</p>
<h1 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 76px; line-height: 0.98; text-transform: uppercase; color: var(--cocoa, #a38273); width: 510px; height: 303px">RESCUED IN JORDAN LOVED AROUND THE WORLD.</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; max-width: 520px; color: var(--accent-text, #704f44)">We rescue, treat and care for street cats and dogs in Jordan, then help them travel safely to loving homes abroad.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; color: var(--paper, #ffffff)">
<a href="#rescues" style="text-decoration: none; background: var(--ink, #2B1E1A); color: var(--paper, #FFFFFF); padding: 16px 28px; border-radius: 999px; font-weight: 500; font-size: 17px">Meet our rescues</a>
<a href="#support" style="text-decoration: none; background: {{accent}}; color: var(--paper, #FFFFFF); padding: 16px 28px; border-radius: 999px; font-weight: 500; font-size: 17px">Support a rescue</a>
</div>
</div>
<div style="flex: 1 1 460px; background: {{accent}}; padding: 26px; border-radius: 4px; width: 582px; height: 590px; box-sizing: border-box">
<div class="stamp" style="background: var(--paper, #FFFFFF); padding: 14px; height: 100%; box-sizing: border-box">
<img src="img/hero.jpg" alt="The founder of Furry Hearts of Jordan hugging a rescued black and white cat wrapped in a pink blanket" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 35%">
</div>
</div>
</section>

<section id="rescues" style="padding: 88px 32px; background-color: var(--cream, #fcf2f0)">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 52px; text-transform: uppercase; color: var(--cocoa, #a38273)">Waiting for a home</h2>
<p style="margin: 0; font-size: 18px; color: var(--accent-text, #704f44)">Every rescue has a full profile: health records, personality and travel status.</p>
</div>
<a href="rescues.html" style="font-weight: 500; font-size: 17px; color: var(--cocoa, #a38273)">See all rescues →</a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 36px">
<template data-sc-for="{{cases}}" data-as="c">
<a href="{{c.href}}" style="text-decoration: none; background: {{c.color}}; padding: 18px; display: block">
<div class="stamp" style="background: var(--paper, #FFFFFF); padding: 14px; display: flex; flex-direction: column; gap: 14px">
<div style="position: relative">
<template data-sc-if="{{c.photo}}">
<img src="{{c.photo}}" alt="{{c.name}}" style="display: block; width: 100%; height: 220px; object-fit: cover; object-position: center 25%">
</template>
<template data-sc-if="{{c.tint}}">
<div style="height: 220px; background: {{c.tint}}; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px">[ Rescue photo ]</div>
</template>
<span aria-label="{{c.kind}}" role="img" style="position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 999px; background: {{c.color}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px var(--paper, #FFFFFF)">
<template data-sc-if="{{c.isCat}}"><img src="img/cat-icon.png" alt="" aria-hidden="true" style="display: block; width: 28px; height: 28px; object-fit: contain"></template>
<template data-sc-if="{{c.isDog}}"><img src="img/dog-icon.png" alt="" aria-hidden="true" style="display: block; width: 28px; height: 28px; object-fit: contain"></template>
</span>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; color: var(--cocoa, #a38273)">
<span style="font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-size: 26px; text-transform: uppercase; color: {{c.textColor}}; min-width: 0; overflow-wrap: anywhere">{{c.name}}</span>
<span style="font-size: 13px; font-weight: 500; background: {{c.color}}; color: var(--paper, #FFFFFF); padding: 5px 10px; border-radius: 999px; background: {{c.statusColor}}; white-space: nowrap">{{c.status}}</span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--accent-text, #704f44)">{{c.meta}}</p>
</div>
</a>
</template>
</div>
</div>
</section>

<section id="adopt" style="max-width: 1240px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 760px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 52px; text-transform: uppercase; color: var(--cocoa, #a38273)">Give them a second chance</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: var(--accent-text, #704f44)">Wherever you are in the world, you can open your home to one of our rescues. One decision from you, and a cat who started life on the streets of Jordan gets a whole new life.</p>
</div>
<div class="fhj-steps" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px">
<template data-sc-for="{{steps}}" data-as="s">
<div style="aspect-ratio: 1 / 1; position: relative; padding: 13%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px">
<svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0"><g style="fill: {{s.color}}"><circle cx="11.96" cy="5.43" r="5.43"></circle><circle cx="11.96" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="11.96" r="5.43"></circle><circle cx="94.57" cy="11.96" r="5.43"></circle><circle cx="22.83" cy="5.43" r="5.43"></circle><circle cx="22.83" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="22.83" r="5.43"></circle><circle cx="94.57" cy="22.83" r="5.43"></circle><circle cx="33.70" cy="5.43" r="5.43"></circle><circle cx="33.70" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="33.70" r="5.43"></circle><circle cx="94.57" cy="33.70" r="5.43"></circle><circle cx="44.57" cy="5.43" r="5.43"></circle><circle cx="44.57" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="44.57" r="5.43"></circle><circle cx="94.57" cy="44.57" r="5.43"></circle><circle cx="55.43" cy="5.43" r="5.43"></circle><circle cx="55.43" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="55.43" r="5.43"></circle><circle cx="94.57" cy="55.43" r="5.43"></circle><circle cx="66.30" cy="5.43" r="5.43"></circle><circle cx="66.30" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="66.30" r="5.43"></circle><circle cx="94.57" cy="66.30" r="5.43"></circle><circle cx="77.17" cy="5.43" r="5.43"></circle><circle cx="77.17" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="77.17" r="5.43"></circle><circle cx="94.57" cy="77.17" r="5.43"></circle><circle cx="88.04" cy="5.43" r="5.43"></circle><circle cx="88.04" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="88.04" r="5.43"></circle><circle cx="94.57" cy="88.04" r="5.43"></circle><rect x="5.43" y="5.43" width="89.13" height="89.13" rx="4.89"></rect></g><rect x="11.68" y="11.68" width="76.63" height="76.63" rx="2.45" style="fill: var(--paper, #ffffff)"></rect></svg>
<img src="img/{{s.icon}}" alt="" style="width: 60px; height: 60px; object-fit: contain">
<h3 style="margin: 0; font-size: 20px; font-weight: 500; color: var(--cocoa, #a38273)"><span style="font-family: var(--font-display, 'Pesta Rakyat', sans-serif); font-weight: 400; color: {{s.color}}">{{s.n}}</span> {{s.title}}</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.4; color: var(--accent-text, #704f44)">{{s.body}}</p>
</div>
</template>
</div>
<div style="color: var(--paper, #FFFFFF); border-radius: 28px; padding: 32px 36px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between; background-color: var(--cocoa, #a38273)">
<p style="margin: 0; font-size: 18px; line-height: 1.6; max-width: 760px"><strong>A little note about the adoption fee:</strong> it is never a price on their head. It simply covers their journey to you: vaccines, microchip, rabies titer test, health certificate, export permits, a travel crate, and their flight with a travel buddy or a trusted pet shipping company. Each rescue's file shows exactly what it includes.</p>
<a href="rescues.html" style="text-decoration: none; color: var(--cocoa, #a38273); padding: 16px 28px; border-radius: 999px; font-weight: 500; font-size: 17px; background-color: var(--paper, #ffffff); white-space: nowrap">Meet our rescues</a>
</div>
