<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furry Hearts of Jordan — Bella's story</title>
<meta name="description" content="Furry Hearts of Jordan rescues, treats and rehomes street cats and dogs in Jordan, with safe international adoption.">
<meta property="og:title" content="Furry Hearts of Jordan — Bella's story">
<meta property="og:description" content="Furry Hearts of Jordan rescues, treats and rehomes street cats and dogs in Jordan, with safe international adoption.">
<meta property="og:image" content="https://furryheartsofjordan.com/img/hero.jpg">
<link rel="icon" href="img/icon-180.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;family=Figtree:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
h1,h2{color:var(--cocoa, #A38273)}
strong,b,th,dt,h3{font-weight:500}
a{color:var(--ink, #704F44)}a:hover{color:var(--accent-text, #704F44)}
.stamp{position:relative}
.stamp::before{content:"";position:absolute;inset:-11px;pointer-events:none;z-index:0;
background:
radial-gradient(circle,#fff 8px,transparent 8.6px) left top/22px 22px space no-repeat,
radial-gradient(circle,#fff 8px,transparent 8.6px) left bottom/22px 22px space no-repeat,
radial-gradient(circle,#fff 8px,transparent 8.6px) left top/22px 22px no-repeat space,
radial-gradient(circle,#fff 8px,transparent 8.6px) right top/22px 22px no-repeat space}
.stamp>*{position:relative;z-index:1}
</style>
<style>html{scroll-behavior:smooth}img{max-width:100%}@media (max-width:720px){h1{font-size:52px!important;width:auto!important;height:auto!important}h2{font-size:38px!important}section,footer{width:auto!important}p{width:auto!important;height:auto!important}}</style>
</head>
<body>
<template id="dc-root">

<div style="font-family: var(--font-sans, 'GT Walsheim', 'Figtree', system-ui, sans-serif); color: var(--ink, #704F44); background: var(--paper, #FFFFFF); min-height: 100vh; font-weight: 300">

<header style="max-width: 1240px; margin: 0 auto; padding: 20px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; padding-top: 50px">
<a href="index.html" aria-label="Furry Hearts of Jordan home" style="display: flex; align-items: center; text-decoration: none">
<img class="logo-wide" src="img/logo-wide.png" alt="Furry Hearts of Jordan — Feeding. Healing. Rehoming" style="width: 260px; max-width: 62vw; height: auto; display: block">
</a>
<a href="index.html#tails" style="font-weight: 500; font-size: 16px; color: var(--cocoa, #A38273)">← All happy tails</a>
</header>

<section style="max-width: 1240px; margin: 0 auto; padding: 32px 32px 72px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div style="flex: 1 1 440px; background: var(--sky, #43BDFF); padding: 22px">
<div class="stamp" style="background: var(--paper, #FFFFFF); padding: 12px">
<img src="img/bella-walk.jpg" alt="Bella, a white dog with one floppy ear, on an autumn forest path" style="display: block; width: 100%; height: 600px; object-fit: cover; object-position: center 70%">
</div>
</div>
<div style="flex: 1 1 480px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<span style="background: var(--sky, #43BDFF); color: var(--paper, #FFFFFF); padding: 8px 16px; border-radius: 999px; font-weight: 500; font-size: 14px">Happy tail ♥</span>
<span style="background: var(--sky, #43BDFF); color: var(--paper, #FFFFFF); padding: 8px 16px; border-radius: 999px; font-weight: 500; font-size: 14px">Jordan → Czech Republic</span>
</div>
<h1 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 96px; line-height: 0.95; text-transform: uppercase; color: var(--sky, #43BDFF)">Bella</h1>
<p style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-size: 28px; line-height: 1.15; text-transform: uppercase; color: var(--sky, #43BDFF)">One family rescued. Every one of them home.</p>
<div style="display: flex; flex-direction: column; gap: 16px; font-size: 18px; line-height: 1.7">
<p style="margin: 0">Bella was rescued in Jordan together with her mother, Beige, her brothers Kouvo and Bruno, and her sisters Vanilla and Aliksa: a whole little family, taken off the street and finally safe.</p>
<p style="margin: 0">We cared for them through treatment, vaccines and growing up. Then, one by one, every single one of them found a loving family. It is one of the most beautiful stories we have ever lived.</p>
<p style="margin: 0">Bella flew from Jordan to her new home in the Czech Republic. Today she walks through autumn forests, naps in her own bed surrounded by toys, and has very strong opinions about stuffed animals.</p>
<p style="margin: 0">Her family still sends us photos and updates from time to time, and every one of them reminds us why we do this.</p>
</div>
</div>
</section>

<section style="background: var(--cream, #FCF2F0); padding: 72px 32px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 44px; text-transform: uppercase">Rescued together</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; max-width: 720px">Bella's mother, two brothers and two sisters all found loving homes too.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<template data-sc-for="{{family}}" data-as="f">
<div style="background: var(--paper, #FFFFFF); border: 3px solid {{f.color}}; border-radius: 999px; padding: 10px 20px 10px 10px; display: flex; align-items: center; gap: 12px">
<template data-sc-if="{{f.hasPhoto}}">
<img src="{{f.photo}}" alt="{{f.name}}" style="width: 48px; height: 48px; border-radius: 999px; object-fit: cover; display: block">
</template>
<template data-sc-if="{{f.noPhoto}}">
<span style="width: 48px; height: 48px; border-radius: 999px; background: {{f.color}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: var(--paper, #FFFFFF)">[photo]</span>
</template>
<div style="display: flex; flex-direction: column; gap: 2px">
<strong style="font-size: 16px; color: {{f.color}}">{{f.name}}</strong>
<span style="font-size: 13px">{{f.note}}</span>
</div>
</div>
</template>
</div>
<div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 36px; text-transform: uppercase; color: var(--orange, #FF9D46)">Meet Beige, Bella's mom</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.6">The mother who started it all. Beige raised her five babies through the hardest start, and today she has a cozy home and a family of her own too.</p>
</div>
<div style="flex: 2 1 560px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px">
<template data-sc-for="{{beige}}" data-as="b">
<img src="{{b.src}}" alt="{{b.alt}}" style="display: block; width: 100%; height: 200px; object-fit: cover; object-position: {{b.pos}}; border-radius: 20px; box-shadow: 0 0 0 4px var(--orange, #FF9D46)">
</template>
</div>
</div>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 88px 32px; display: flex; flex-direction: column; gap: 32px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 52px; text-transform: uppercase">Bella today</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px">
<template data-sc-for="{{photos}}" data-as="p">
<figure style="margin: 0; background: {{p.color}}; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<img src="{{p.src}}" alt="{{p.alt}}" style="display: block; width: 100%; height: 300px; object-fit: cover; object-position: {{p.pos}}">
<figcaption style="font-size: 15px; font-weight: 500; color: var(--paper, #FFFFFF)">{{p.caption}}</figcaption>
</figure>
</template>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto 96px; padding: 0 32px">
<div style="background: var(--peach, #FFB68D); padding: 22px">
<div class="stamp" style="background: var(--paper, #FFFFFF); padding: 48px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: space-between">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 44px; line-height: 1.02; text-transform: uppercase">Write the next happy tail</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6">More rescues like Bella are waiting for their family, anywhere in the world.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="rescues.html" style="text-decoration: none; background: var(--peach, #FFB68D); color: var(--paper, #FFFFFF); padding: 17px 28px; border-radius: 999px; font-weight: 500; font-size: 17px">Meet our rescues</a>
<a href="index.html#cliq" style="text-decoration: none; background: var(--peach, #FFB68D); color: var(--paper, #FFFFFF); padding: 17px 28px; border-radius: 999px; font-weight: 500; font-size: 17px">Donate</a>
</div>
</div>
</div>
</section>

<footer style="background: var(--accent-text, #704F44); color: var(--paper, #FFFFFF); padding: 48px 32px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; font-size: 15px">
<img src="img/logo-round.png" alt="Furry Hearts of Jordan logo" style="width: 120px; height: 120px">
<span>Help with transport. Foster. Donate. Adopt. Share.</span>
</div>
</footer>
</div>
</template>
<div id="dc-app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Please turn on JavaScript to see this page.</p></noscript>
<script type="text/x-dc">
class Component extends DCLogic {
renderVals() {
const fam = (list) => list.map((f) => ({ ...f, photo: f.photo || '', hasPhoto: !!f.photo, noPhoto: !f.photo }));
return {
beige: [
{ src: 'img/beige-face.jpg', alt: 'Beige resting her head on a flowered blanket', pos: 'center 40%' },
{ src: 'img/beige-walk.jpg', alt: 'Beige in a yellow jacket on a walk', pos: 'center 35%' },
{ src: 'img/beige-sofa.jpg', alt: 'Beige curled up on the sofa with a red pillow', pos: 'center 45%' },
{ src: 'img/beige-stretch.jpg', alt: 'Beige stretched out on a patterned blanket', pos: 'center 40%' }
],
family: fam([
{ name: 'Beige', note: 'Mother · adopted ✓', color: 'var(--orange, #FF9D46)', photo: 'img/beige-chip.jpg' },
{ name: 'Kouvo', note: 'Brother · adopted ✓', color: 'var(--denim, #436FB0)' },
{ name: 'Bruno', note: 'Brother · adopted ✓', color: 'var(--teal, #3DCAD1)' },
{ name: 'Vanilla', note: 'Sister · adopted ✓', color: 'var(--orchid, #E86CE8)' },
{ name: 'Aliksa', note: 'Sister · adopted ✓', color: 'var(--coral, #FF696A)' }
]),
photos: [
{ src: 'img/bella-sit.jpg', alt: 'Bella sitting at home with her pink collar', caption: 'That famous one-ear-up look', pos: 'center 30%', color: 'var(--orchid, #E86CE8)' },
{ src: 'img/bella-leaves.jpg', alt: 'Bella standing in autumn leaves', caption: 'Autumn walks', pos: 'center 55%', color: 'var(--orange, #FF9D46)' },
{ src: 'img/bella-bed.jpg', alt: 'Bella resting in her dog bed with toys', caption: 'Her own bed, her own toys', pos: 'center 40%', color: 'var(--teal, #3DCAD1)' },
{ src: 'img/bella-chew.jpg', alt: 'Bella chewing a stuffed toy', caption: 'Strong opinions about stuffed toys', pos: 'center 45%', color: 'var(--coral, #FF696A)' },
{ src: 'img/bella-frost.jpg', alt: 'Bella exploring a frosty meadow', caption: 'Her first frosty mornings', pos: 'center 75%', color: 'var(--purple, #BF45FF)' },
{ src: 'img/bella-roll.jpg', alt: 'Bella rolling happily on the floor', caption: 'Pure happiness', pos: 'center 50%', color: 'var(--green, #4BC939)' }
]
};
}
}
</script>
<script src="js/dc-runtime.js"></script>
</body>
</html>
