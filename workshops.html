<template id="dc-root">

<div style="font-family: var(--font-sans, 'GT Walsheim', 'Figtree', system-ui, sans-serif); color: var(--ink, #704F44); background: var(--paper, #FFFFFF); min-height: 100vh; font-weight: 300">

<header class="fhj-header"><a href="index.html" aria-label="Furry Hearts of Jordan home" class="fhj-logo"><img src="img/logo-header.png" alt="Furry Hearts of Jordan — Safe Homes. Lifelong Care."></a><nav class="fhj-nav" aria-label="Main"><a href="about.html">About Us</a><div class="fhj-dd"><a href="rescues.html" class="fhj-dd-btn">Adopt <span aria-hidden="true">▾</span></a><div class="fhj-dd-menu"><a href="rescues.html">Our Rescues</a><a href="index.html#adopt">How to adopt</a></div></div><a href="tails.html">Happy Tails</a><a href="cat-world.html">Cat World</a><a href="shop.html">Ted's Shop</a><a class="fhj-donate" href="index.html#support">Donate</a></nav><details class="fhj-menu"><summary aria-label="Menu"><span></span><span></span><span></span></summary><nav aria-label="Menu"><a href="about.html">About Us</a><span class="fhj-sub-title">Adopt</span><div class="fhj-sub"><a href="rescues.html">Our Rescues</a><a href="index.html#adopt">How to adopt</a></div><a href="tails.html">Happy Tails</a><a href="cat-world.html">Cat World</a><a href="shop.html">Ted's Shop</a><a class="fhj-donate" href="index.html#support">Donate</a></nav></details></header>
<section style="max-width: 1240px; margin: 0 auto; padding: 48px 32px 40px; display: flex; flex-direction: column; gap: 32px">
<div class="fhj-ind" style="display: flex; flex-direction: column; gap: 16px; max-width: 796px; padding-left: 36px">
<a href="cat-world.html" style="align-self: flex-start; font-weight: 500; font-size: 16px; color: var(--cocoa, #a38273)">← Cat World</a>
<h1 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 72px; line-height: 1; text-transform: uppercase; color: var(--cocoa, #a38273); color: var(--peach, #ffb68d)">{{c.title}}</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: var(--accent-text, #704f44); text-wrap: balance">{{c.intro}}</p>
<p style="margin: 0; font-size: 17px; font-weight: 500; color: var(--peach, #ffb68d)">{{c.why}}</p>
<div style="display: flex; gap: 18px; align-items: center; padding: 18px 22px; border-radius: 20px; box-shadow: inset 0 0 0 3px var(--peach, #ffb68d); background: #fff">
<svg viewBox="0 0 40 40" width="64" height="64" aria-hidden="true" style="flex: 0 0 auto"><rect x="4" y="6" width="32" height="22" rx="4" style="fill: #ffb68d"></rect><path d="M10 13h20M10 19h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round"></path><circle cx="28" cy="27" r="6" fill="#fff" style="stroke: #ffb68d" stroke-width="3"></circle><path d="M25 32l-2 6 5-2 5 2-2-6" style="fill: #ffb68d"></path></svg>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: var(--accent-text, #704f44)"><strong style="font-weight: 500; color: var(--peach, #ffb68d)">Certificate included. </strong>{{c.cert}}</p>
</div>
<p style="margin: 4px 0 0; padding: 16px 20px; border-radius: 20px; background: var(--cream, #fcf2f0); font-size: 15px; line-height: 1.6; color: var(--accent-text, #704f44)">{{c.note}}</p>
</div>
<div class="fhj-signs" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<template data-sc-for="{{ws}}" data-as="t">
<article style="border-radius: 28px; padding: 28px; background: color-mix(in srgb, {{t.color}} 10%, white); box-shadow: inset 0 0 0 4px {{t.color}}; display: flex; flex-direction: column; gap: 10px">
<span style="align-self: flex-start; padding: 5px 12px; border-radius: 999px; background: {{t.color}}; color: #fff; font-size: 13px; font-weight: 500">With a vet</span>
<h3 style="margin: 0; font-size: 23px; font-weight: 500; color: {{t.color}}">{{t.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: var(--accent-text, #704f44)">{{t.body}}</p>
<p style="margin: 0; font-size: 14px; font-weight: 500; color: {{t.color}}">For: {{t.for}}</p>
<div style="margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<a href="{{igMsg}}" data-msg="{{t.msg}}" target="_blank" rel="noopener" style="text-decoration: none; background: {{t.color}}; color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 500; font-size: 15px">Register your interest</a>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: {{t.color}}"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true" style="flex: 0 0 auto"><rect x="4" y="6" width="32" height="22" rx="4" style="fill: {{t.color}}"></rect><path d="M10 13h20M10 19h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round"></path><circle cx="28" cy="27" r="6" fill="#fff" style="stroke: {{t.color}}" stroke-width="3"></circle><path d="M25 32l-2 6 5-2 5 2-2-6" style="fill: {{t.color}}"></path></svg>Certificate included</span>
</div>
</article>
</template>
</div>
<article style="border-radius: 28px; padding: 28px; background: color-mix(in srgb, var(--orange) 10%, white); box-shadow: inset 0 0 0 4px var(--orange); display: flex; flex-direction: column; gap: 10px">
<span style="align-self: flex-start; padding: 5px 12px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 13px; font-weight: 500">Videos · Coming soon</span>
<h3 style="margin: 0; font-size: 23px; font-weight: 500; color: var(--orange)">{{c.videos_title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: var(--accent-text, #704f44); max-width: 820px">{{c.videos_body}}</p>
</article>
</section>
<section style="max-width: 1240px; margin: 0 auto; padding: 24px 32px 96px">
<div style="border-radius: 28px; padding: 32px 36px; background: var(--cream, #fcf2f0); display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 680px"><h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', sans-serif); font-weight: 400; font-size: 44px; line-height: 1.05; text-transform: uppercase; color: var(--peach, #ffb68d)">{{c.ask_title}}</h2><p style="margin: 0; font-size: 18px; line-height: 1.65; color: var(--accent-text, #704f44); text-wrap: balance">{{c.ask_body}}</p></div>
<a href="{{igMsg}}" data-msg="Hi Furry Hearts of Jordan! I am interested in your workshops (sent from furryheartsofjordan.com)" target="_blank" rel="noopener" style="text-decoration: none; background: var(--peach, #ffb68d); color: #fff; padding: 16px 28px; border-radius: 999px; font-weight: 500; font-size: 17px">Message us on Instagram</a>
</div>
</section>
<footer class="fhj-footer"><div class="fhj-foot-in"><img class="fhj-foot-logo" src="img/logo-round.png" alt="Furry Hearts of Jordan logo"><p class="fhj-slogan">Rewriting their story,<br>one paw at a time.</p><div class="fhj-foot-info"><span>Amman, Jordan</span><a href="https://www.instagram.com/furryheartsofjordan/" target="_blank" rel="noopener">@furryheartsofjordan</a><a href="https://www.instagram.com/theteefamilyhouse/" target="_blank" rel="noopener">@theteefamilyhouse</a></div></div></footer>
</div>
</template>
<div id="dc-app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Please turn on JavaScript to see this page.</p></noscript>
<script type="text/x-dc">
class Component extends DCLogic {
constructor(props) { super(props); this.state = {}; }
renderVals() {
const F = window.FHJ, D = F.data, S = D.settings || {}, c = D.workshops || {};
return { c, igMsg: 'https://ig.me/m/' + (S.instagram_user || ''),
  ws: (c.workshops || []).map((t) => ({ ...t, color: F.color(t.color), msg: 'Hi Furry Hearts of Jordan! I would like to join the workshop: ' + t.title + ' (sent from furryheartsofjordan.com)' })) };
}
}
</script>
<script src="js/dc-runtime.js"></script>
</body>
</html>
