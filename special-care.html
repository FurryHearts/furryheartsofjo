<body>
<template id="dc-root">

<div style="font-family: var(--font-sans, 'GT Walsheim', 'Figtree', system-ui, sans-serif); color: var(--ink, #704F44); background: var(--paper, #FFFFFF); min-height: 100vh; font-weight: 300">

<header class="fhj-header"><a href="index.html" aria-label="Furry Hearts of Jordan home" class="fhj-logo"><img src="img/logo-header.png" alt="Furry Hearts of Jordan — Safe Homes. Lifelong Care."></a><nav class="fhj-nav" aria-label="Main"><a href="about.html">About Us</a><div class="fhj-dd"><a href="rescues.html" class="fhj-dd-btn">Adopt <span aria-hidden="true">▾</span></a><div class="fhj-dd-menu"><a href="rescues.html">Our Rescues</a><a href="index.html#adopt">How to adopt</a><a href="travel.html">Travel & costs</a></div></div><a href="tails.html">Happy Tails</a><a href="cat-world.html">Cat World</a><a href="shop.html">Ted's Shop</a><a class="fhj-donate" href="index.html#support">Donate</a></nav><details class="fhj-menu"><summary aria-label="Menu"><span></span><span></span><span></span></summary><nav aria-label="Menu"><a href="about.html">About Us</a><span class="fhj-sub-title">Adopt</span><div class="fhj-sub"><a href="rescues.html">Our Rescues</a><a href="index.html#adopt">How to adopt</a><a href="travel.html">Travel & costs</a></div><a href="tails.html">Happy Tails</a><a href="cat-world.html">Cat World</a><a href="shop.html">Ted's Shop</a><a class="fhj-donate" href="index.html#support">Donate</a></nav></details></header>
<section style="max-width: 1240px; margin: 0 auto; padding: 48px 32px 40px; display: flex; flex-direction: column; gap: 36px">
<div class="fhj-ind" style="display: flex; flex-direction: column; gap: 16px; max-width: 796px; padding-left: 36px">
<a href="cat-world.html" style="align-self: flex-start; font-weight: 500; font-size: 16px; color: var(--cocoa, #a38273)">← Cat World</a>
<h1 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 72px; line-height: 1; text-transform: uppercase; color: var(--cocoa, #a38273); color: var(--peach, #ffb68d)">{{c.title}}</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: var(--accent-text, #704f44); text-wrap: balance">{{c.intro}}</p>
<template data-sc-if="{{c.note}}"><p style="margin: 4px 0 0; padding: 16px 20px; border-radius: 20px; background: var(--cream, #fcf2f0); font-size: 15px; line-height: 1.6; color: var(--accent-text, #704f44); text-wrap: pretty">{{c.note}}</p></template>
</div>
<template data-sc-for="{{groups}}" data-as="g">
<div style="display: flex; flex-direction: column; gap: 20px">
<template data-sc-if="{{g.title}}"><h2 class="fhj-ind" style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 44px; text-transform: uppercase; color: var(--cocoa, #a38273); padding-left: 36px; color: var(--peach, #ffb68d)">{{g.title}}</h2></template>
<div class="fhj-tiles" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<template data-sc-for="{{g.topics}}" data-as="t">
<a href="{{t.href}}" style="cursor: {{t.cursor}}; aspect-ratio: 1 / 1; position: relative; padding: 14%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; text-decoration: none; background: var(--paper, #fff)">
<svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0"><g style="fill: {{t.color}}"><circle cx="11.96" cy="5.43" r="5.43"></circle><circle cx="11.96" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="11.96" r="5.43"></circle><circle cx="94.57" cy="11.96" r="5.43"></circle><circle cx="22.83" cy="5.43" r="5.43"></circle><circle cx="22.83" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="22.83" r="5.43"></circle><circle cx="94.57" cy="22.83" r="5.43"></circle><circle cx="33.70" cy="5.43" r="5.43"></circle><circle cx="33.70" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="33.70" r="5.43"></circle><circle cx="94.57" cy="33.70" r="5.43"></circle><circle cx="44.57" cy="5.43" r="5.43"></circle><circle cx="44.57" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="44.57" r="5.43"></circle><circle cx="94.57" cy="44.57" r="5.43"></circle><circle cx="55.43" cy="5.43" r="5.43"></circle><circle cx="55.43" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="55.43" r="5.43"></circle><circle cx="94.57" cy="55.43" r="5.43"></circle><circle cx="66.30" cy="5.43" r="5.43"></circle><circle cx="66.30" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="66.30" r="5.43"></circle><circle cx="94.57" cy="66.30" r="5.43"></circle><circle cx="77.17" cy="5.43" r="5.43"></circle><circle cx="77.17" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="77.17" r="5.43"></circle><circle cx="94.57" cy="77.17" r="5.43"></circle><circle cx="88.04" cy="5.43" r="5.43"></circle><circle cx="88.04" cy="94.57" r="5.43"></circle><circle cx="5.43" cy="88.04" r="5.43"></circle><circle cx="94.57" cy="88.04" r="5.43"></circle><rect x="5.43" y="5.43" width="89.13" height="89.13" rx="4.89"></rect></g><rect x="11.68" y="11.68" width="76.63" height="76.63" rx="2.45" style="fill: var(--paper, #ffffff)"></rect></svg>
<span class="fhj-ico" aria-hidden="true" style="display: block; width: 64px; height: 64px; background: {{t.color}}; -webkit-mask: url(img/cat-icon.png) center/contain no-repeat; mask: url(img/cat-icon.png) center/contain no-repeat"></span>
<h3 style="margin: 0; font-size: 20px; font-weight: 500; color: {{t.color}}">{{t.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; font-size: 13.5px; text-wrap: balance; color: {{t.color}}">{{t.body}}</p>
<template data-sc-if="{{t.soon}}"><span style="margin-top: 6px; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, {{t.color}} 14%, white); color: {{t.color}}">Coming soon</span></template>
</a>
</template>
</div>
</div>
</template>
</section>
<section style="max-width: 1240px; margin: 0 auto; padding: 24px 32px 96px">
<div style="border-radius: 28px; padding: 32px 36px; background: var(--cream, #fcf2f0); display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 680px"><h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', sans-serif); font-weight: 400; font-size: 44px; line-height: 1.05; text-transform: uppercase; color: var(--peach, #ffb68d)">{{c.ask_title}}</h2><p style="margin: 0; font-size: 18px; line-height: 1.65; color: var(--accent-text, #704f44); text-wrap: balance">{{c.ask_body}}</p></div>
<a href="{{igMsg}}" data-msg="{{askMsg}}" target="_blank" rel="noopener" style="text-decoration: none; background: var(--peach, #ffb68d); color: #fff; padding: 16px 28px; border-radius: 999px; font-weight: 500; font-size: 17px">Ask us on Instagram</a>
</div>
</section>
<footer class="fhj-footer"><div class="fhj-foot-in"><img class="fhj-foot-logo" src="img/logo-round.png" alt="Furry Hearts of Jordan logo"><p class="fhj-slogan">Safe Homes.<br>Lifelong Care.</p><div class="fhj-foot-info"><span style="display:inline-flex;align-items:center;gap:9px"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 21.5s-6.5-6.2-6.5-11.3a6.5 6.5 0 0 1 13 0c0 5.1-6.5 11.3-6.5 11.3z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="10.2" r="2.4" fill="#fff"/></svg>Amman, Jordan</span><a href="https://www.instagram.com/furryheartsofjordan/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="17.3" cy="6.7" r="1.3" fill="#fff"/></svg>@furryheartsofjordan</a><a href="https://www.instagram.com/theteefamilyhouse/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="17.3" cy="6.7" r="1.3" fill="#fff"/></svg>@theteefamilyhouse</a><a href="https://www.youtube.com/@FurryHeartsofJo" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="1.5" y="5" width="21" height="14" rx="4.5" fill="#fff"/><path d="M10 9 L15.5 12 L10 15 Z" fill="#ffb68d"/></svg>@FurryHeartsofJo</a></div></div></footer>
</div>
</template>
<div id="dc-app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Please turn on JavaScript to see this page.</p></noscript>
<script type="text/x-dc">
class Component extends DCLogic {
constructor(props) { super(props); this.state = {}; }
renderVals() {
const F = window.FHJ, D = F.data, S = D.settings || {}, c = D.specialcare || {};
return { c, igMsg: 'https://ig.me/m/' + (S.instagram_user || ''), askMsg: 'Hi Furry Hearts of Jordan! I have a question about ' + String(c.title || '').toLowerCase() + ' (sent from furryheartsofjordan.com)',
  groups: (c.groups || [{ title: '', topics: c.topics || [] }]).map((g) => ({ title: g.title || '', topics: (g.topics || []).map((t) => ({ ...t, color: F.color(t.color), href: t.link || 'javascript:void(0)', cursor: t.link ? 'pointer' : 'default', soon: !t.link })) })) };
}
}
</script>
<script src="js/dc-runtime.js"></script>
</body>
</html>
