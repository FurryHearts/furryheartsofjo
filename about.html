<meta property="og:description" content="Furry Hearts of Jordan rescues, treats and rehomes street cats and dogs in Jordan, with safe international adoption.">

<style>
body{margin:0}
h1,h2{color:var(--cocoa, #A38273)}
strong,b,th,dt,h3{font-weight:500}
a{color:var(--ink, #704F44)}a:hover{color:var(--accent-text, #704F44)}
.stamp{position:relative}
.stamp::before{content:"";position:absolute;inset:-11px;pointer-events:none;z-index:0;
background:
radial-gradient(circle,#fff 8px,transparent 8.6px) left top/22px 22px space no-repeat,
radial-gradient(circle,#fff 8px,transparent 8.6px) left bottom/22px 22px space no-repeat,
radial-gradient(circle,#fff 8px,transparent 8.6px) left top/22px 22px no-repeat space,
radial-gradient(circle,#fff 8px,transparent 8.6px) right top/22px 22px no-repeat space}
.stamp>*{position:relative;z-index:1}
</style>
<style>html{scroll-behavior:smooth}img{max-width:100%}@media (max-width:720px){h1{font-size:52px!important;width:auto!important;height:auto!important}h2{font-size:38px!important}section,footer{width:auto!important}p{width:auto!important;height:auto!important}}.fhj-steps>*{min-width:0}@media (max-width:1100px){.fhj-steps{grid-template-columns:repeat(3,minmax(0,1fr))!important}}@media (max-width:720px){.fhj-steps{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}.fhj-steps>*{padding:10px!important;gap:4px!important;border-radius:22px!important}.fhj-steps>* span{width:26px!important;height:26px!important;font-size:14px!important;top:8px!important;left:8px!important}.fhj-steps h3{font-size:15px!important}.fhj-steps p{font-size:12px!important;line-height:1.3!important}.fhj-steps img{width:40px!important;height:40px!important}}.fhj-header{max-width:1240px;margin:0 auto;padding:50px 32px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:20}.fhj-logo img{width:260px;max-width:62vw;height:auto;display:block}.fhj-nav{display:flex;align-items:center;gap:26px;font-weight:500;font-size:16px}.fhj-nav a,.fhj-menu nav a{text-decoration:none;color:var(--cocoa,#A38273)}.fhj-nav a[aria-current]{text-decoration:underline;text-underline-offset:6px}.fhj-header .fhj-donate{background:var(--peach,#FFB68D);color:var(--paper,#fff)!important;padding:12px 24px;border-radius:999px}.fhj-menu{display:none;position:relative}.fhj-menu summary{list-style:none;cursor:pointer;width:48px;height:48px;border-radius:14px;border:3px solid var(--peach,#FFB68D);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.fhj-menu summary::-webkit-details-marker{display:none}.fhj-menu summary span{display:block;width:22px;height:3px;border-radius:3px;background:var(--cocoa,#A38273)}.fhj-menu nav{position:absolute;right:0;top:58px;background:var(--paper,#fff);border:3px solid var(--peach,#FFB68D);border-radius:24px;padding:12px;display:flex;flex-direction:column;min-width:220px;box-shadow:0 12px 30px rgba(112,79,68,.15)}.fhj-menu nav a{padding:12px 14px;font-weight:500;font-size:17px;border-radius:14px}.fhj-menu nav .fhj-donate{text-align:center;margin-top:6px}.fhj-dd{position:relative}.fhj-dd-btn span{font-size:12px}.fhj-dd-menu{display:none;position:absolute;left:-14px;top:100%;padding-top:12px;min-width:190px}.fhj-dd-menu::before{content:"";position:absolute;inset:12px 0 0;background:var(--paper,#fff);border:3px solid var(--peach,#FFB68D);border-radius:20px;box-shadow:0 12px 30px rgba(112,79,68,.15)}.fhj-dd-menu a{position:relative;display:block;padding:12px 18px}.fhj-dd-menu a:first-child{margin-top:8px}.fhj-dd-menu a:last-child{margin-bottom:8px}.fhj-dd:hover .fhj-dd-menu,.fhj-dd:focus-within .fhj-dd-menu{display:block}.fhj-sub-title{padding:12px 14px 2px;font-weight:500;font-size:17px;color:var(--cocoa,#A38273)}.fhj-sub{display:flex;flex-direction:column;padding-left:14px}.fhj-sub a{font-size:15px!important;font-weight:400!important}@media (max-width:980px){.fhj-nav{display:none}.fhj-menu{display:block}.fhj-header{padding:24px 20px 12px}}.fhj-tiles>*{min-width:0}@media (max-width:980px){.fhj-tiles{grid-template-columns:repeat(3,minmax(0,1fr))!important}}@media (max-width:720px){.fhj-tiles{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}.fhj-tiles>*{padding:10px!important;gap:4px!important;border-radius:22px!important}.fhj-tiles h3{font-size:15px!important}.fhj-tiles p{font-size:12px!important;line-height:1.3!important}.fhj-tiles img{width:40px!important;height:40px!important}.fhj-tiles>* span{font-size:10px!important;top:6px!important;right:6px!important;padding:2px 7px!important}}</style>
</head>
<body>
<template id="dc-root">

<div style="font-family: var(--font-sans, 'GT Walsheim', 'Figtree', system-ui, sans-serif); color: var(--ink, #704F44); background: var(--paper, #FFFFFF); min-height: 100vh; font-weight: 300">

<header class="fhj-header"><a href="index.html" aria-label="Furry Hearts of Jordan home" class="fhj-logo"><img src="img/logo-wide.png" alt="Furry Hearts of Jordan — Feeding. Healing. Rehoming"></a><nav class="fhj-nav" aria-label="Main"><a href="about.html" aria-current="page">About Us</a><div class="fhj-dd"><a href="rescues.html" class="fhj-dd-btn">Adopt <span aria-hidden="true">▾</span></a><div class="fhj-dd-menu"><a href="rescues.html">Our Rescues</a><a href="index.html#adopt">How to adopt</a></div></div><a href="index.html#tails">Happy Tails</a><a href="cat-world.html">Cat World</a><a href="shop.html">Ted's Shop</a><a class="fhj-donate" href="index.html#support">Donate</a></nav><details class="fhj-menu"><summary aria-label="Menu"><span></span><span></span><span></span></summary><nav aria-label="Menu"><a href="about.html" aria-current="page">About Us</a><span class="fhj-sub-title">Adopt</span><div class="fhj-sub"><a href="rescues.html">Our Rescues</a><a href="index.html#adopt">How to adopt</a></div><a href="index.html#tails">Happy Tails</a><a href="cat-world.html">Cat World</a><a href="shop.html">Ted's Shop</a><a class="fhj-donate" href="index.html#support">Donate</a></nav></details></header>
<section style="max-width: 1240px; margin: 0 auto; padding: 48px 32px 72px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 48px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 72px; line-height: 1; text-transform: uppercase; color: var(--cocoa, #a38273)">{{a.title}}</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: var(--accent-text, #704f44); font-size: 22px; font-weight: 400">{{a.intro}}</p>
</div>
<img src="img/hero.jpg" alt="Dina with a rescue cat" style="width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 32px">
</section>
<section style="background: var(--cream, #fcf2f0); padding: 80px 32px">
<div style="max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 44px; text-transform: uppercase; color: var(--cocoa, #a38273)">{{a.first_title}}</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: var(--accent-text, #704f44)">{{a.first_body}}</p>
<template data-sc-for="{{storyParas}}" data-as="p"><p style="margin: 0; font-size: 18px; line-height: 1.65; color: var(--accent-text, #704f44)">{{p.text}}</p></template>
<template data-sc-if="{{noStory}}"><p style="margin: 0; font-size: 18px; line-height: 1.65; color: var(--accent-text, #704f44); font-style: italic; color: var(--cocoa, #a38273)">{{a.story_soon}}</p></template>
</div>
</section>
<section style="max-width: 1240px; margin: 0 auto; padding: 80px 32px 96px; display: flex; flex-direction: column; gap: 28px">
<h2 style="margin: 0; font-family: var(--font-display, 'Pesta Rakyat', 'Bagel Fat One', sans-serif); font-weight: 400; font-size: 44px; text-transform: uppercase; color: var(--cocoa, #a38273)">{{a.today_title}}</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: var(--accent-text, #704f44); max-width: 820px">{{a.today_body}}</p>
<div class="fhj-tiles" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; max-width: 760px">
<template data-sc-for="{{pillars}}" data-as="t">
<div style="aspect-ratio: 1 / 1; position: relative; border: 3px solid {{t.color}}; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; text-decoration: none; background: var(--paper, #fff)">
<img src="img/{{t.icon}}" alt="" style="width: 72px; height: 72px; object-fit: contain">
<h3 style="margin: 0; font-size: 20px; font-weight: 500; color: var(--cocoa, #a38273)">{{t.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: var(--accent-text, #704f44)">{{t.body}}</p>

</div>
</template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<a href="rescues.html" style="text-decoration: none; background: var(--cocoa, #a38273); color: var(--paper, #fff); padding: 16px 28px; border-radius: 999px; font-weight: 500">Meet our rescues</a>
<a href="index.html#support" style="text-decoration: none; background: var(--peach, #ffb68d); color: var(--paper, #fff); padding: 16px 28px; border-radius: 999px; font-weight: 500">Donate</a>
</div>
</section>
<footer style="color: var(--paper, #FFFFFF); padding: 48px 32px; background-color: var(--cocoa, #a38273)">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; font-size: 15px">
<img src="img/logo-round.png" alt="Furry Hearts of Jordan logo" style="width: 120px; height: 120px">
<span>Help with transport. Foster. Donate. Adopt. Share.</span>
</div>
</footer>
</div>
</template>
<div id="dc-app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Please turn on JavaScript to see this page.</p></noscript>
<script type="text/x-dc">
class Component extends DCLogic {
constructor(props) { super(props); this.state = {}; }
renderVals() {
const F = window.FHJ, D = F.data, a = D.about || {};
const storyParas = String(a.story || '').split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean).map((text) => ({ text }));
return { a, storyParas, noStory: !storyParas.length,
  pillars: (a.pillars || []).map((t) => ({ ...t, color: F.color(t.color) })) };
}
}
</script>
<script src="js/dc-runtime.js"></script>
</body>
</html>
